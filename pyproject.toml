[project]
name = "obsidian-knowledge-mcp"
version = "0.1.0"
description = "Read-only source retrieval and evidence-based wiki memory over MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.26,<2", "uvicorn>=0.34,<1", "pyyaml>=6,<7",
  "filelock>=3.18,<4", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7",
  "httpx>=0.28,<1", "numpy>=2,<3",
]

[project.optional-dependencies]
semantic = [
  # 1.30 crashes at import in our Linux ARM64 emulator; retain the verified ARM runtime.
  "onnxruntime==1.22.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "onnxruntime>=1.22,<2; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "tokenizers>=0.21,<1",
]
model-build = ["optimum[onnxruntime]>=2,<3", "transformers>=4.51,<5", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "onnx>=1.17,<2"]

[project.scripts]
knowledge-mcp = "knowledge_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
